<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Jump Game — Jerrel Adriel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="sound" src="assets/Neverland.mp3" loop></audio>
  <div class="container">
    <h3>Jump Game 🦕</h3>

    <div class="info-bar">
      <span>Skor: <b id="score-val">0</b></span>
      <span>High: <b id="high-val">0</b></span>
    </div>

    <div id="game">
      <div id="karakter"></div>

      <div id="overlay">
        <h2 id="overlay-title">Jump Game 🦕</h2>
        <div id="overlay-info" class="info">
          <div>Spasi / Tap = Lompat</div>
          <div>Double Jump untuk rintangan tinggi! ✨</div>
          <div style="color:#fcd34d; margin-top:4px;">↑ = rintangan terbang</div>
        </div>
        <button id="start-btn">Mulai Game</button>
      </div>
    </div>

    <p class="hint">
      Klik / Tap / Spasi = Lompat &nbsp;·&nbsp; Tekan dua kali = Double Jump
    </p>
    <a href="index.html" class="back-link">← Kembali ke Portfolio</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
